# Security section :
# ------------------
# PS: The following passwords can be generated with: openssl rand -base64 756 | tr -d '\n'
# Set the password for the MongoDB admin user 
#MONGOD_ADMIN_PASSWORD=changePassword

# Set the password for the MongoDB user dedicated to MongoT
#MONGOD_SEARCH_PASSWORD=changePassword

# Set the password for the MongoDB user dedicated to application
#MONGOD_APPUSER_PASSWORD=changePassword
#
# Set the password for the MongoDB Cluster 
#MONGOD_CLUSTER_PASSWORD=changePassword

# Replicat set section :
# ----------------------

# Is the server used as a secondary node in a cluster? (cannot be modified after the initial configuration)
#RS_SECONDARY_NODE=true 

# If the server is a primary node in a cluster, what are the secondary nodes?
#RS_SECONDARY_HOSTS=hostA:27017,hostB:27017,hostC:27017
