syncSource:
  replicaSet:
    hostAndPort: "0.0.0.0:27017"
    scramAuth:
      username: mongotUser
      authSource: admin
      passwordFile: /mongot-community/pwfile
      tls:
        enabled: false
storage:
  dataPath: "/data/mongot"

server:
  grpc:
    address: "0.0.0.0:27028"
    tls:
      mode: "disabled"

metrics:
  enabled: true
  address: "0.0.0.0:9946"

healthCheck:
  address: "0.0.0.0:8080"

logging:
  verbosity: INFO
